name: Build and Release

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :android:assembleDebug

      - name: Build Release APK
        run: ./gradlew :android:assembleRelease

      - name: Build Desktop distribution
        run: ./gradlew :desktop:distZip

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/build/outputs/apk/debug/android-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/build/outputs/apk/release/android-release-unsigned.apk

      - name: Upload Desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: desktop/build/distributions/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: app-debug

      - name: Determine prerelease
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-debug.apk
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body: |
            Geometry Duel (几何决斗) ${{ github.ref_name }}

            安装 `android-debug.apk` 到安卓设备即可游玩。
          generate_release_notes: true
